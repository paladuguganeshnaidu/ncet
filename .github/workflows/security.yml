name: NCET Security Audit

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: Python SAST and dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install audit tooling
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.7,<3"
      - name: Check medium/high-severity code patterns
        run: bandit -q -r app -ll -ii
      - name: Audit published dependency vulnerabilities
        run: pip-audit -r requirements.txt

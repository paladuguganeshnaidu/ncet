name: NCET Security Audit

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: Python SAST and dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install audit tooling
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.7,<3"
      - name: Check medium/high-severity code patterns
        run: bandit -q -r app -ll -ii
      - name: Audit published dependency vulnerabilities
        run: pip-audit -r requirements.txt

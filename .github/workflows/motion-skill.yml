name: Transitions.dev skill installation smoke test
on:
  push:
    branches: [feature/institutional-ui-motion-refresh-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install transitions.dev agent skill in ephemeral no-secrets runner
        run: bash scripts/install-motion-skill.sh
